<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="旅行清單">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>自訂出國攜帶清單</title>
<style>
:root{
  --bg:#f5f7fb;--card:#fff;--text:#111827;--muted:#6b7280;
  --line:#e5e7eb;--accent:#2563eb;--danger:#dc2626;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;
  background:var(--bg);color:var(--text);
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}
.app{max-width:760px;margin:auto;padding:16px 14px 120px}
.top{
  position:sticky;top:0;z-index:20;background:rgba(245,247,251,.94);
  backdrop-filter:blur(12px);padding:10px 0 12px
}
h1{font-size:26px;margin:0 0 5px}
.sub{font-size:14px;color:var(--muted)}
.progressWrap{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-top:14px}
.progress{height:100%;background:var(--accent);width:0;transition:.2s}
.progressText{font-size:13px;color:var(--muted);margin-top:6px}
.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
button,input{font:inherit}
button{
  border:0;border-radius:12px;padding:11px 12px;background:#111827;color:#fff;font-weight:700
}
button.secondary{background:#fff;color:#111827;border:1px solid var(--line)}
.category{
  background:var(--card);border-radius:18px;margin:12px 0;
  box-shadow:0 2px 12px rgba(0,0,0,.04);overflow:hidden
}
.catHead{
  display:flex;align-items:center;gap:8px;padding:14px 14px 11px;border-bottom:1px solid var(--line)
}
.catTitle{font-size:18px;font-weight:800;flex:1}
.count{font-size:12px;color:var(--muted);background:#f3f4f6;padding:4px 8px;border-radius:999px}
.items{padding:4px 10px}
.item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid #f1f5f9}
.item:last-child{border-bottom:0}
.item input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:0 0 auto}
.itemName{flex:1;font-size:16px}
.item.done .itemName{text-decoration:line-through;color:#9ca3af}
.mini{background:transparent;color:#6b7280;padding:6px 7px;font-weight:600}
.addRow{display:flex;gap:8px;padding:10px}
.addRow input,.modal input{
  flex:1;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff;color:var(--text)
}
.emptyState{
  background:var(--card);border:1px dashed var(--line);border-radius:18px;padding:34px 20px;
  text-align:center;color:var(--muted);margin-top:18px
}
.emptyState strong{display:block;color:var(--text);font-size:18px;margin-bottom:6px}
.floating{
  position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));background:var(--accent);
  border-radius:999px;padding:14px 18px;box-shadow:0 8px 24px rgba(37,99,235,.30)
}
dialog{border:0;border-radius:18px;padding:0;width:min(92vw,420px);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(0,0,0,.35)}
.modal{padding:18px}.modal h2{margin:0 0 12px}.modalActions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
@media (prefers-color-scheme:dark){
 :root{--bg:#0b1220;--card:#111827;--text:#f9fafb;--muted:#9ca3af;--line:#263244}
 .top{background:rgba(11,18,32,.94)}
 button.secondary,.addRow input,.modal input{background:#111827;color:#fff}
 .count{background:#1f2937}.item{border-bottom-color:#1f2937}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>✈️ 自訂出國攜帶清單</h1>
    <div class="sub">分類與物品都可自由新增、刪除與改名</div>
    <div class="progressWrap"><div class="progress" id="progress"></div></div>
    <div class="progressText" id="progressText">0 / 0 已完成</div>
    <div class="toolbar">
      <button class="secondary" onclick="uncheckAll()">全部取消勾選</button>
      <button class="secondary" onclick="clearAll()">清空全部</button>
    </div>
  </div>
  <div id="categories"></div>
  <button class="floating" onclick="openCategoryDialog()">＋ 新增分類</button>
</div>

<dialog id="categoryDialog">
  <div class="modal">
    <h2>新增分類</h2>
    <input id="categoryName" placeholder="例如：證件、衣物、攝影器材">
    <div class="modalActions">
      <button class="secondary" onclick="categoryDialog.close()">取消</button>
      <button onclick="addCategory()">新增</button>
    </div>
  </div>
</dialog>

<script>
const KEY='travel_checklist_custom_pwa_v1';
let data=JSON.parse(localStorage.getItem(KEY)||'null')||[];

function save(){ localStorage.setItem(KEY,JSON.stringify(data)); render(); }
function esc(s){ return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])); }

function render(){
  const root=document.getElementById('categories');
  root.innerHTML='';

  if(data.length===0){
    root.innerHTML=`
      <div class="emptyState">
        <strong>目前還沒有任何分類</strong>
        點右下角「＋ 新增分類」開始建立自己的攜帶清單。
      </div>`;
  }

  data.forEach((cat,ci)=>{
    const done=cat.items.filter(x=>x.done).length;
    const el=document.createElement('section');
    el.className='category';
    el.innerHTML=`
      <div class="catHead">
        <div class="catTitle">${esc(cat.name)}</div>
        <div class="count">${done}/${cat.items.length}</div>
        <button class="mini" onclick="renameCategory(${ci})">改名</button>
        <button class="mini" onclick="deleteCategory(${ci})">刪除</button>
      </div>
      <div class="items">
        ${cat.items.map((it,ii)=>`
          <div class="item ${it.done?'done':''}">
            <input type="checkbox" ${it.done?'checked':''} onchange="toggleItem(${ci},${ii})">
            <div class="itemName">${esc(it.name)}</div>
            <button class="mini" onclick="renameItem(${ci},${ii})">編輯</button>
            <button class="mini" onclick="deleteItem(${ci},${ii})">×</button>
          </div>`).join('')}
      </div>
      <div class="addRow">
        <input id="new-${ci}" placeholder="新增物品…" onkeydown="if(event.key==='Enter') addItem(${ci})">
        <button onclick="addItem(${ci})">新增</button>
      </div>`;
    root.appendChild(el);
  });

  const total=data.reduce((n,c)=>n+c.items.length,0);
  const done=data.reduce((n,c)=>n+c.items.filter(i=>i.done).length,0);
  const pct=total?Math.round(done/total*100):0;
  document.getElementById('progress').style.width=pct+'%';
  document.getElementById('progressText').textContent=`${done} / ${total} 已完成（${pct}%）`;
}

function openCategoryDialog(){
  categoryName.value='';
  categoryDialog.showModal();
  setTimeout(()=>categoryName.focus(),50);
}
function addCategory(){
  const name=categoryName.value.trim();
  if(!name)return;
  data.push({name,items:[]});
  categoryDialog.close();
  save();
}
function renameCategory(ci){
  const name=prompt('修改分類名稱：',data[ci].name);
  if(name&&name.trim()){data[ci].name=name.trim();save();}
}
function deleteCategory(ci){
  if(confirm(`確定刪除「${data[ci].name}」與其中所有物品？`)){data.splice(ci,1);save();}
}
function addItem(ci){
  const input=document.getElementById('new-'+ci);
  const name=input.value.trim();
  if(!name)return;
  data[ci].items.push({name,done:false});
  input.value='';
  save();
}
function toggleItem(ci,ii){data[ci].items[ii].done=!data[ci].items[ii].done;save();}
function renameItem(ci,ii){
  const name=prompt('修改物品名稱：',data[ci].items[ii].name);
  if(name&&name.trim()){data[ci].items[ii].name=name.trim();save();}
}
function deleteItem(ci,ii){
  if(confirm('刪除這個物品？')){data[ci].items.splice(ii,1);save();}
}
function uncheckAll(){
  if(confirm('確定取消所有勾選？')){data.forEach(c=>c.items.forEach(i=>i.done=false));save();}
}
function clearAll(){
  if(confirm('確定清空全部分類與物品？這個動作無法復原。')){data=[];save();}
}
render();

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
}
</script>
</body>
</html>
